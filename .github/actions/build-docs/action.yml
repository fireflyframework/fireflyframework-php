name: Build documentation and books
description: Validate both manuscripts and build the site with PDF and EPUB downloads.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
    - name: Install rendering dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2 libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-liberation poppler-utils
        python -m venv book/.venv
        book/.venv/bin/pip install -r book/build/requirements.txt
    - name: Validate and build documentation
      shell: bash
      run: bash scripts/build-docs.sh
