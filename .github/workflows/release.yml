name: Release (single package)

# Packagist reads tags from this repository's root composer.json.
# This gate validates the tagged distribution; indexing is checked separately (docs/publishing.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Validate package (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: bash scripts/check-no-sensitive-tracked.sh
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer mono-validate
      - run: composer test:package
