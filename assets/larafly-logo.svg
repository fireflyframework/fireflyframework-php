<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="LaraFly">
  <title>LaraFly</title>
  <desc>The LaraFly firefly glyph, drawn on its own for the site header: an amber spark halo, two pale wings, a dark body and a glowing tail, with the banner's spark trail below.</desc>
  <defs>
    <radialGradient id="lfl-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(25,21)">
    <circle r="20" fill="url(#lfl-spark)"/>
    <ellipse cx="-8.6" cy="-6.6" rx="10.4" ry="5.2" fill="#e0f2fe" opacity="0.55" transform="rotate(-22 -8.6 -6.6)"/>
    <ellipse cx="8.6" cy="-6.6" rx="10.4" ry="5.2" fill="#e0f2fe" opacity="0.55" transform="rotate(22 8.6 -6.6)"/>
    <ellipse cx="0" cy="1.4" rx="5.2" ry="7.6" fill="#1f2937"/>
    <ellipse cx="0" cy="-2.8" rx="3.4" ry="3.1" fill="#111827"/>
    <ellipse cx="0" cy="7.6" rx="3.1" ry="3.8" fill="#fbbf24"/>
    <ellipse cx="0" cy="7.6" rx="3.1" ry="3.8" fill="#fde68a" opacity="0.6"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="10" cy="37" r="1.9" opacity="0.85"/>
    <circle cx="5.4" cy="42" r="1.3" opacity="0.6"/>
    <circle cx="3.4" cy="44.2" r="0.8" opacity="0.35"/>
  </g>
</svg>
