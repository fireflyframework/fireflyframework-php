<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1173.6" font-family="sans-serif" data-original-view-box="0 0 1200 1080">
  <title>The genuine same-transaction outbox</title>
  <desc>Aggregate transaction writes the outbox row in-tx; a separate terminal consumer claims PENDING rows with FOR UPDATE SKIP LOCKED.</desc>
  <defs>
    <marker id="ob-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62645b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="1078" rx="12" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/>

  <text x="600" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#10110f">The genuine same-transaction outbox</text>
  <text x="600" y="52" text-anchor="middle" font-size="11" fill="#62645b">packages/data/src/{Transaction/TransactionTemplate.php,Domain/DomainEventDispatcher.php}</text>
  <text x="600" y="66" text-anchor="middle" font-size="11" fill="#62645b">packages/eda-postgres/src/{Outbox/OutboxPreCommitHook.php,PostgresEventPublisher.php,PostgresEventConsumer.php}</text>

  <!-- Section 1: the aggregate's transaction -->
  <rect x="80" y="80" width="1040" height="490" rx="10" fill="none" stroke="#62645b" stroke-width="1.5"/>
  <text x="600" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#10110f">IN THE AGGREGATE'S OWN TRANSACTION — single connection</text>

  <rect x="120" y="114" width="960" height="36" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="137" text-anchor="middle" font-size="12.5" fill="#10110f">#[Transactional] method call → TransactionInterceptor → TransactionTemplate::execute()</text>

  <line x1="600" y1="150" x2="600" y2="162" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="164" width="960" height="32" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="185" text-anchor="middle" font-size="12.5" fill="#10110f">connection-&gt;beginTransaction()</text>

  <line x1="600" y1="196" x2="600" y2="208" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="210" width="960" height="38" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="233" text-anchor="middle" font-size="12.5" fill="#10110f">$work() runs: aggregate mutates state; RecordsDomainEvents records events onto AggregateTracker</text>

  <line x1="600" y1="248" x2="600" y2="260" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="262" width="960" height="42" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="280" text-anchor="middle" font-size="12.5" fill="#10110f">Pre-commit drain (still inside the tx): DomainEventDispatcher::dispatchAfterCommit($connection)</text>
  <text x="600" y="296" text-anchor="middle" font-size="12.5" fill="#10110f">drains the tracker — for each event, afterCommit($event, $connection) runs:</text>

  <line x1="600" y1="304" x2="600" y2="316" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <!-- (a) same-tx outbox path (emphasized) -->
  <rect x="120" y="318" width="560" height="140" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.75"/>
  <text x="400" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">(a) OutboxPreCommitHook — the same-tx path</text>
  <text x="140" y="358" font-size="11.5" fill="#10110f">resolves the AGGREGATE'S OWN connection</text>
  <text x="140" y="374" font-size="11.5" fill="#10110f">(ConnectionResolverInterface)</text>
  <text x="140" y="394" font-size="11.5" fill="#10110f">new PostgresEventPublisher(conn, channel,</text>
  <text x="140" y="410" font-size="11.5" fill="#10110f">emitNotify = driver is pgsql)</text>
  <text x="140" y="430" font-size="11.5" fill="#10110f">EdaCommandEventPublisher::publish(event) → INSERT</text>
  <text x="140" y="446" font-size="11.5" fill="#10110f">firefly_eda_outbox (status=PENDING) on THIS connection/tx</text>

  <!-- (b) in-process leg (de-emphasized) -->
  <rect x="700" y="318" width="380" height="140" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25" stroke-dasharray="5,4"/>
  <text x="890" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">(b) in-process leg</text>
  <text x="890" y="353" text-anchor="middle" font-size="11" fill="#10110f">(separate from the outbox)</text>
  <text x="720" y="374" font-size="11" fill="#10110f">DB::connection($connection)-&gt;afterCommit(</text>
  <text x="740" y="390" font-size="11" fill="#10110f">fn() =&gt; ApplicationEventPublisher-&gt;publish($event)</text>
  <text x="720" y="406" font-size="11" fill="#10110f">) — registered now, fires LATER after the real commit</text>
  <text x="720" y="424" font-size="11" fill="#10110f">drives in-process #[AsEventListener]s only —</text>
  <text x="720" y="440" font-size="11" fill="#10110f">no outbox write on this leg</text>

  <text x="400" y="472" text-anchor="middle" font-size="11" fill="#10110f">+ SELECT pg_notify(channel, id) — same tx, pgsql only</text>

  <line x1="600" y1="458" x2="600" y2="492" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="380" y="494" width="440" height="38" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="600" y="517" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">connection-&gt;commit()</text>

  <text x="600" y="550" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#10110f">ATOMIC — outbox row + aggregate's own writes commit together, or both roll back</text>

  <!-- Bridge arrow between the two frames (process boundary) -->
  <line x1="600" y1="570" x2="600" y2="624" stroke="#62645b" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ob-arrow)"/>
  <text x="770" y="600" text-anchor="middle" font-size="10.5" fill="#62645b" font-style="italic">separate process — woken by LISTEN/NOTIFY, or by its own poll fallback</text>

  <!-- Section 2: terminal consumer -->
  <rect x="80" y="628" width="1040" height="420" rx="10" fill="none" stroke="#62645b" stroke-width="1.5"/>
  <text x="600" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#10110f">TERMINAL CONSUMER — separate long-running process (firefly:eda:consume → PostgresEventConsumer)</text>

  <rect x="120" y="662" width="960" height="34" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="684" text-anchor="middle" font-size="12.5" fill="#10110f">subscribe(): LISTEN &lt;channel&gt; (pgsql)</text>

  <line x1="600" y1="696" x2="600" y2="708" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="710" width="960" height="46" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="730" text-anchor="middle" font-size="12.5" fill="#10110f">poll(timeoutMs): NotificationWaiter waits (best-effort) for the queued NOTIFY —</text>
  <text x="600" y="747" text-anchor="middle" font-size="12.5" fill="#10110f">delivered exactly when the row's commit lands</text>

  <line x1="600" y1="756" x2="600" y2="768" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="770" width="960" height="46" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.75"/>
  <text x="600" y="790" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">claim: SELECT * FROM firefly_eda_outbox WHERE status='PENDING'</text>
  <text x="600" y="807" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">ORDER BY id FOR UPDATE SKIP LOCKED (pgsql)</text>

  <line x1="600" y1="816" x2="600" y2="828" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="830" width="960" height="42" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="600" y="848" text-anchor="middle" font-size="12.5" fill="#10110f">ConsumerLoop delivers the ReceivedEnvelope to SubscriberRegistry →</text>
  <text x="600" y="864" text-anchor="middle" font-size="12.5" fill="#10110f">drives matching #[EventListener] handler(s)</text>

  <line x1="350" y1="872" x2="350" y2="884" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>
  <line x1="850" y1="872" x2="850" y2="884" stroke="#62645b" stroke-width="1.5" marker-end="url(#ob-arrow)"/>

  <rect x="120" y="886" width="460" height="54" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.25"/>
  <text x="350" y="908" text-anchor="middle" font-size="12" fill="#10110f">success → ack(): UPDATE … SET status='PUBLISHED'</text>
  <text x="350" y="925" text-anchor="middle" font-size="12" fill="#10110f">WHERE id=? AND status='PENDING' (idempotent)</text>

  <rect x="620" y="886" width="460" height="54" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="850" y="908" text-anchor="middle" font-size="12" fill="#10110f">throw → nack(): attempts+1 → back to PENDING (retry)</text>
  <text x="850" y="925" text-anchor="middle" font-size="12" fill="#10110f">or, past max_attempts, status='FAILED'</text>

  <text x="600" y="970" text-anchor="middle" font-size="11.5" fill="#46483f" font-style="italic">No EventPublisher::publish() call anywhere in this consumer path — it reads/updates the outbox</text>
  <text x="600" y="988" text-anchor="middle" font-size="11.5" fill="#46483f" font-style="italic">table directly: no re-INSERT, no self-reference.</text>

  <text x="600" y="1020" text-anchor="middle" font-size="11" fill="#62645b" font-style="italic">A single consumer worker gives exactly-once in-process delivery; multiple workers degrade to at-least-once (handlers should be idempotent).</text>

