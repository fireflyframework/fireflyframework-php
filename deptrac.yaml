deptrac:
  paths:
    - ./packages
  layers:
    - name: Kernel
      collectors:
        - type: directory
          value: packages/kernel/src/.*
    - name: Container
      collectors:
        - type: directory
          value: packages/container/src/.*
  ruleset:
    # Kernel is the zero-dependency foundation.
    Kernel: ~
    # Container may depend on Kernel (and on external Illuminate/Symfony, which Deptrac ignores as unlayered).
    Container:
      - Kernel
