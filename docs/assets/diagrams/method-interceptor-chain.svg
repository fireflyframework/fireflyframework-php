<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1016.72" font-family="sans-serif" data-original-view-box="0 0 1240 920">
  <title>Method interceptor chain</title>
  <desc>How every AdviceSource contributes rows to one compiled ProxyPlan, how ProxyClassGenerator emits a single proxy class per bean carrying one interceptor property and one baked descriptor factory per advice kind, and how a call then runs security at advice order 100 before transaction at order 1000 through MethodInvocation::proceed().</desc>
  <defs>
    <marker id="mic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62645b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1238" height="918" rx="12" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/>

  <text x="620" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#10110f">One proxy per bean: how an advice becomes a link in the chain</text>
  <text x="620" y="48" text-anchor="middle" font-size="10.5" fill="#62645b">packages/data/src/Proxy/{Advice.php, AdviceSource.php, ProxyPlanner.php, ProxyPlanCompiler.php, ProxyClassGenerator.php, ProxyFactory.php, InterceptorRegistry.php, MethodInvocation.php}</text>
  <text x="620" y="61" text-anchor="middle" font-size="10.5" fill="#62645b">packages/security/src/Access/Method/{MethodSecurityAdviceSource.php, MethodSecurityInterceptor.php} · packages/data/src/{Proxy/TransactionalAdviceSource.php, Transaction/TransactionInterceptor.php}</text>

  <rect x="36" y="78" width="1168" height="24" rx="6" fill="#faf9f6" stroke="#62645b" stroke-width="1.25"/>
  <text x="620" y="95" text-anchor="middle" font-size="12" fill="#10110f">Scan and compile — php artisan firefly:cache (or an in-process scan of firefly.scan.paths when there is no cache)</text>

  <rect x="36" y="114" width="376" height="86" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="224" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">MethodSecurityAdviceSource</text>
  <text x="48" y="154" font-size="10.8" fill="#46483f">#[Component] in firefly/security</text>
  <text x="48" y="170" font-size="10.8" fill="#46483f">advice(): Advice('security', MethodSecurityInterceptor,</text>
  <text x="48" y="185" font-size="10.8" fill="#46483f">SecurityMethodDescriptor, order 100, inertWhenUnbound: true)</text>

  <rect x="432" y="114" width="376" height="86" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="620" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">TransactionalAdviceSource</text>
  <text x="444" y="154" font-size="10.8" fill="#46483f">#[Component] in firefly/data</text>
  <text x="444" y="170" font-size="10.8" fill="#46483f">advice(): Advice::transactional() — Advice('tx',</text>
  <text x="444" y="185" font-size="10.8" fill="#46483f">TransactionInterceptor, TransactionalDescriptor, order 1000)</text>

  <rect x="828" y="114" width="376" height="86" rx="8" fill="#f3f1eb" stroke="#a6a295" stroke-width="1.25"/>
  <text x="1016" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">…any other AdviceSource</text>
  <text x="840" y="154" font-size="10.8" fill="#46483f">The port is open: a package contributes a kind of advice</text>
  <text x="840" y="170" font-size="10.8" fill="#46483f">by shipping one #[Component] that implements</text>
  <text x="840" y="185" font-size="10.8" fill="#46483f">AdviceSource — advice(), scan($psr4), render($row).</text>

  <line x1="224" y1="200" x2="500" y2="222" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>
  <line x1="620" y1="200" x2="620" y2="222" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>
  <line x1="1016" y1="200" x2="740" y2="222" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="200" y="224" width="840" height="56" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="620" y="245" text-anchor="middle" font-size="12.5" fill="#10110f">ProxyPlanner merges every source's scan() rows into one ProxyPlan:</text>
  <text x="620" y="264" text-anchor="middle" font-size="12" fill="#46483f">class → method → the ordered (advice id, descriptor row) pairs — sources merge in Advice::order, so each list is outermost-first</text>

  <line x1="620" y1="280" x2="620" y2="296" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="200" y="298" width="840" height="52" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="620" y="318" text-anchor="middle" font-size="12" fill="#10110f">ProxyPlanCompiler var_exports the plan into proxy-plan.php — a literal the cached boot requires without reflecting</text>
  <text x="620" y="336" text-anchor="middle" font-size="12" fill="#46483f">ProxyClassGenerator writes ONE class per bean: final class Foo__FireflyTransactionalProxy extends Foo</text>

  <line x1="620" y1="350" x2="620" y2="366" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="200" y="368" width="840" height="74" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="620" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">The generated proxy — one member pair PER ADVICE KIND the class uses</text>
  <text x="620" y="408" text-anchor="middle" font-size="11.5" fill="#46483f">private MethodInterceptor $__fireflySecurityInterceptor; · private MethodInterceptor $__fireflyTxInterceptor;</text>
  <text x="620" y="425" text-anchor="middle" font-size="11.5" fill="#46483f">static __fireflySecurityDescriptor('m') / __fireflyTxDescriptor('m') — the descriptors baked as literals, no lookup, no reflection</text>

  <rect x="36" y="462" width="1168" height="24" rx="6" fill="#faf9f6" stroke="#62645b" stroke-width="1.25"/>
  <text x="620" y="479" text-anchor="middle" font-size="12" fill="#10110f">Runtime — one call, resolved from the container as the proxy, wrapped by ProxyFactory with the interceptors InterceptorRegistry hands it</text>

  <rect x="36" y="508" width="300" height="46" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="186" y="529" text-anchor="middle" font-size="12" fill="#10110f">$accounts-&gt;transfer($amount)</text>
  <text x="186" y="545" text-anchor="middle" font-size="10.5" fill="#62645b">the caller holds the proxy, not the bean</text>

  <line x1="336" y1="531" x2="356" y2="531" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="358" y="498" width="846" height="82" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="372" y="518" font-size="11.5" fill="#10110f">(new MethodInvocation($this, AccountService::class, 'transfer', [$amount],</text>
  <text x="396" y="535" font-size="11.5" fill="#46483f">[$this-&gt;__fireflySecurityInterceptor, $this-&gt;__fireflyTxInterceptor],</text>
  <text x="396" y="552" font-size="11.5" fill="#46483f">[SecurityMethodDescriptor::class =&gt; self::__fireflySecurityDescriptor('transfer'), TransactionalDescriptor::class =&gt; …],</text>
  <text x="396" y="569" font-size="11.5" fill="#46483f">fn (array $__fireflyArgs) =&gt; parent::transfer(...$__fireflyArgs)))-&gt;proceed()</text>

  <rect x="140" y="600" width="960" height="44" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <rect x="152" y="610" width="70" height="24" rx="4" fill="#f3f1eb" stroke="#a6a295"/>
  <text x="187" y="627" text-anchor="middle" font-size="11" fill="#10110f">order 100</text>
  <text x="236" y="619" font-size="12" fill="#10110f">MethodSecurityInterceptor — reads SecurityMethodDescriptor, evaluates #[PreAuthorize] and #[PreFilter],</text>
  <text x="236" y="636" font-size="12" fill="#46483f">writes a narrowed argument back with setArguments(), then proceed(). A refusal throws HERE — before any transaction exists.</text>

  <line x1="620" y1="644" x2="620" y2="658" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="140" y="660" width="960" height="44" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <rect x="152" y="670" width="70" height="24" rx="4" fill="#f3f1eb" stroke="#a6a295"/>
  <text x="187" y="687" text-anchor="middle" font-size="11" fill="#10110f">order 1000</text>
  <text x="236" y="679" font-size="12" fill="#10110f">TransactionInterceptor — reads TransactionalDescriptor: propagation, isolation, readOnly, the enforced timeout,</text>
  <text x="236" y="696" font-size="12" fill="#46483f">the rollback rules. Opens or joins the transaction through TransactionTemplate::execute(), then proceed().</text>

  <line x1="620" y1="704" x2="620" y2="718" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="140" y="720" width="960" height="36" rx="8" fill="#f3f1eb" stroke="#a6a295" stroke-width="1.25"/>
  <text x="620" y="743" text-anchor="middle" font-size="12" fill="#10110f">terminal: parent::transfer(...$args) — the real method, receiving whatever the list holds when it is finally reached</text>

  <line x1="620" y1="756" x2="620" y2="770" stroke="#62645b" stroke-width="1.5" marker-end="url(#mic-arrow)"/>

  <rect x="140" y="772" width="960" height="46" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="620" y="792" text-anchor="middle" font-size="12" fill="#10110f">Unwinding, outermost LAST: TransactionInterceptor commits or rolls back, then MethodSecurityInterceptor's after()</text>
  <text x="620" y="809" text-anchor="middle" font-size="12" fill="#46483f">applies #[PostAuthorize] and #[PostFilter] to the value the method returned.</text>

  <text x="620" y="845" text-anchor="middle" font-size="11.5" fill="#46483f">Lower advice order runs OUTER — the same ordering Spring documents for @EnableMethodSecurity against @EnableTransactionManagement. It is what makes</text>
  <text x="620" y="862" text-anchor="middle" font-size="11.5" fill="#46483f">"a refusal never opens a transaction" a property of the compiled plan rather than a convention anyone has to remember.</text>
  <text x="620" y="886" text-anchor="middle" font-size="10.5" fill="#62645b" font-style="italic">An advice whose interceptor bean is absent is refused at boot (ConfigurationException) unless it declared inertWhenUnbound — security does, because</text>
  <text x="620" y="901" text-anchor="middle" font-size="10.5" fill="#62645b" font-style="italic">"annotations are inert until firefly.security.enabled is on" is its documented state — and InterceptorRegistry then hands the proxy a PassThroughInterceptor.</text>

