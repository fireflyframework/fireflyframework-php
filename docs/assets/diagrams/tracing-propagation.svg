<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1049.2" font-family="sans-serif" data-original-view-box="0 0 1400 940">
  <title>Trace context propagation</title>
  <desc>A W3C traceparent entering at the server filter and flowing outward: the SERVER span published to Laravel Context as firefly.trace_id and firefly.span_id, an INTERNAL span on each CQRS message, a PRODUCER span on publish and a CONSUMER span on delivery around an EDA envelope whose headers carry the traceparent — the in-memory and queue buses, the RabbitMQ, Kafka and Postgres publishers and the outbox relay all reach that seam, while SubscriberRegistrySink traces the delivery side for every broker consumer — and a CLIENT span on every outbound Http call that injects it again, landing on every log line, on the httpexchanges endpoint and on the dashboard.</desc>
  <defs>
    <marker id="tpp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62645b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1398" height="938" rx="12" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/>

  <text x="700" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#10110f">One traceparent, five boundaries, three places you can read it</text>
  <text x="700" y="48" text-anchor="middle" font-size="10.5" fill="#62645b">packages/observability/src/Web/{TracingFilter.php, HttpClientTracingMiddleware.php} · packages/observability/src/Tracing/W3CTraceContextPropagator.php</text>
  <text x="700" y="61" text-anchor="middle" font-size="10.5" fill="#62645b">packages/observability/src/{Cqrs/TracerCqrsTracing.php, Eda/TracerEdaTracing.php, Logging/TraceContextLogProcessor.php, Boot/HttpClientTracingPass.php} · packages/eda/src/Tracing/BrokerTracing.php</text>

  <rect x="40" y="82" width="480" height="44" rx="8" fill="#f3f1eb" stroke="#a6a295" stroke-width="1.25"/>
  <text x="280" y="102" text-anchor="middle" font-size="12" fill="#10110f">Inbound request header</text>
  <text x="280" y="119" text-anchor="middle" font-size="11" fill="#46483f">traceparent: 00-{32 hex trace-id}-{16 hex span-id}-01</text>
  <text x="530" y="108" font-size="10.5" fill="#62645b" font-style="italic">absent → a new root trace starts here</text>

  <line x1="280" y1="126" x2="280" y2="142" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>

  <rect x="40" y="144" width="1320" height="74" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="700" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#10110f">TracingFilter — #[Order(-110)], the outermost ordered filter in the chain</text>
  <text x="700" y="184" text-anchor="middle" font-size="11.5" fill="#46483f">W3CTraceContextPropagator::extract($request-&gt;headers-&gt;all()) → the remote parent · startSpan($method, SpanKind::Server, …, $parent)</text>
  <text x="700" y="201" text-anchor="middle" font-size="11.5" fill="#46483f">renamed to `GET /orders/{id}` once the router has matched · http.request.method, url.path, url.scheme, server.address, http.route, http.response.status_code, firefly.correlation_id · ERROR on 5xx</text>

  <line x1="700" y1="218" x2="700" y2="234" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>

  <rect x="380" y="236" width="640" height="52" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="700" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">Laravel Context and Request::$attributes</text>
  <text x="700" y="275" text-anchor="middle" font-size="11.5" fill="#46483f">firefly.trace_id · firefly.span_id — the one place everything downstream reads the ids from</text>

  <line x1="500" y1="288" x2="230" y2="326" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>
  <line x1="700" y1="288" x2="700" y2="326" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>
  <line x1="900" y1="288" x2="1170" y2="326" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>

  <rect x="40" y="328" width="380" height="174" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="230" y="349" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">CQRS · in-process</text>
  <text x="52" y="370" font-size="11" fill="#46483f">CqrsTracing seam in firefly/cqrs (NoOpCqrsTracing by</text>
  <text x="52" y="386" font-size="11" fill="#46483f">default), filled by TracerCqrsTracing.</text>
  <text x="52" y="406" font-size="11" fill="#10110f">INTERNAL span per command and per query,</text>
  <text x="52" y="422" font-size="11" fill="#10110f">named by the message's short class name</text>
  <text x="52" y="438" font-size="11" fill="#46483f">firefly.cqrs.kind · firefly.cqrs.message</text>
  <text x="52" y="458" font-size="10.5" fill="#62645b" font-style="italic">nothing to carry — it nests under whatever is current</text>
  <text x="52" y="474" font-size="10.5" fill="#62645b" font-style="italic">gated by firefly.observability.tracing.cqrs.enabled, which</text>
  <text x="52" y="489" font-size="10.5" fill="#62645b" font-style="italic">is on by default under the master tracing gate.</text>

  <rect x="432" y="328" width="536" height="174" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="700" y="349" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">EDA · across the transport</text>
  <text x="444" y="370" font-size="11" fill="#46483f">EdaTracing seam in firefly/eda, filled by TracerEdaTracing. Reached from the in-memory</text>
  <text x="444" y="386" font-size="11" fill="#46483f">and queue buses, from SubscriberRegistrySink (the sink every broker consumer feeds), from</text>
  <text x="444" y="402" font-size="11" fill="#46483f">RabbitMqEventPublisher, KafkaEventPublisher and PostgresEventPublisher (both its writers),</text>
  <text x="444" y="418" font-size="11" fill="#46483f">and from OutboxRelay, whose traceConsume() keeps the relay hop on the row's own trace.</text>
  <text x="444" y="438" font-size="11" fill="#10110f">PRODUCER `publish &lt;destination&gt;` writes traceparent/tracestate into the headers</text>
  <text x="444" y="454" font-size="11" fill="#10110f">CONSUMER `process &lt;destination&gt;` on delivery reads them back and continues that trace</text>
  <text x="444" y="474" font-size="10.5" fill="#62645b" font-style="italic">gated by firefly.observability.tracing.eda.enabled; firefly.eda.tracing.brokers.enabled=false</text>
  <text x="444" y="489" font-size="10.5" fill="#62645b" font-style="italic">downgrades the three broker publishers alone to the no-op, so none of ours is stamped.</text>

  <rect x="980" y="328" width="380" height="174" rx="8" fill="#fff0d8" stroke="#62645b" stroke-width="1.25"/>
  <text x="1170" y="349" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">Outbound HTTP</text>
  <text x="992" y="370" font-size="11" fill="#46483f">HttpClientTracingMiddleware, installed on the Http</text>
  <text x="992" y="386" font-size="11" fill="#46483f">factory by HttpClientTracingPass at boot.</text>
  <text x="992" y="406" font-size="11" fill="#10110f">CLIENT span · inject() writes traceparent on the</text>
  <text x="992" y="422" font-size="11" fill="#10110f">PSR-7 request — url.path, never url.full</text>
  <text x="992" y="438" font-size="11" fill="#46483f">ERROR at ≥ 400 or on a rejection</text>
  <text x="992" y="458" font-size="10.5" fill="#62645b" font-style="italic">works under Http::fake(): global middleware is outermost</text>
  <text x="992" y="474" font-size="10.5" fill="#62645b" font-style="italic">gated by firefly.observability.tracing.http-client.enabled,</text>
  <text x="992" y="489" font-size="10.5" fill="#62645b" font-style="italic">read by the boot pass rather than by a bean condition.</text>

  <line x1="230" y1="502" x2="230" y2="526" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>
  <line x1="700" y1="502" x2="700" y2="526" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>
  <line x1="1170" y1="502" x2="1170" y2="526" stroke="#62645b" stroke-width="1.5" marker-end="url(#tpp-arrow)"/>

  <rect x="40" y="528" width="1320" height="46" rx="8" fill="#faf9f6" stroke="#62645b" stroke-width="1.25"/>
  <text x="700" y="548" text-anchor="middle" font-size="12.5" fill="#10110f">The next service's own TracingFilter extracts the same traceparent — and the trace continues, across the process boundary, with no shared code</text>
  <text x="700" y="565" text-anchor="middle" font-size="10.5" fill="#62645b" font-style="italic">The propagator speaks W3C Trace Context over a plain header map, with no SDK involved: version `ff` and all-zero ids are rejected, a future version is read for its first four fields.</text>

  <text x="700" y="612" text-anchor="middle" font-size="14" font-weight="bold" fill="#10110f">Where the ids land</text>

  <rect x="40" y="628" width="380" height="122" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="230" y="649" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">Every log line</text>
  <text x="52" y="670" font-size="11" fill="#46483f">TraceContextLogProcessor adds trace_id and span_id</text>
  <text x="52" y="686" font-size="11" fill="#46483f">to each record, beside the correlation and request ids.</text>
  <text x="52" y="706" font-size="11" fill="#10110f">firefly.logging.structured.format: json · ecs · logstash</text>
  <text x="52" y="726" font-size="10.5" fill="#62645b" font-style="italic">attached per channel at resolution time, so a channel</text>
  <text x="52" y="741" font-size="10.5" fill="#62645b" font-style="italic">built after boot with Log::build() gets neither.</text>

  <rect x="432" y="628" width="536" height="122" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="700" y="649" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">/actuator/httpexchanges</text>
  <text x="444" y="670" font-size="11" fill="#46483f">HttpExchangeFilter (-100) runs INSIDE the tracing filter, so the span already exists</text>
  <text x="444" y="686" font-size="11" fill="#46483f">when it records the exchange, and it reads the traceId TracingFilter published off</text>
  <text x="444" y="702" font-size="11" fill="#46483f">Request::$attributes rather than off Context.</text>
  <text x="444" y="724" font-size="10.5" fill="#62645b" font-style="italic">every row carries the trace it belonged to</text>
  <text x="444" y="739" font-size="10.5" fill="#62645b" font-style="italic">a ring of the last 100 by default — httpexchanges.capacity, clamped to [1, 10000]</text>

  <rect x="980" y="628" width="380" height="122" rx="8" fill="#edf1e8" stroke="#62645b" stroke-width="1.5"/>
  <text x="1170" y="649" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">The admin dashboard</text>
  <text x="992" y="670" font-size="11" fill="#46483f">firefly/admin renders the same exchanges page</text>
  <text x="992" y="686" font-size="11" fill="#46483f">server-side from the actuator registries — no</text>
  <text x="992" y="702" font-size="11" fill="#46483f">second data path, no JavaScript fetch.</text>
  <text x="992" y="724" font-size="10.5" fill="#62645b" font-style="italic">read its access model before exposing it: the</text>
  <text x="992" y="739" font-size="10.5" fill="#62645b" font-style="italic">dashboard ships no authentication of its own.</text>

  <rect x="40" y="772" width="1320" height="72" rx="8" fill="#faf9f6" stroke="#62645b" stroke-width="1.25"/>
  <text x="700" y="793" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#10110f">What is actually recording</text>
  <text x="700" y="812" text-anchor="middle" font-size="11.5" fill="#46483f">The shipped default is NoOpTracer: non-recording spans, an invalid SpanContext, currentSpan() of null — every instrumentation site tests</text>
  <text x="700" y="829" text-anchor="middle" font-size="11.5" fill="#46483f">$span-&gt;context()-&gt;isValid() before publishing ids. The OpenTelemetry adapter binds itself when the SDK is installed and firefly.observability.tracing.enabled is on.</text>

  <text x="700" y="878" text-anchor="middle" font-size="11.5" fill="#46483f">Both seams follow the CqrsMetrics shape: an interface in the owning package with a no-op default behind #[ConditionalOnMissingBean], and observability's</text>
  <text x="700" y="895" text-anchor="middle" font-size="11.5" fill="#46483f">#[Order(500)] auto-configuration registering the real implementation first. Neither firefly/cqrs nor firefly/eda depends on firefly/observability.</text>
  <text x="700" y="920" text-anchor="middle" font-size="10.5" fill="#62645b" font-style="italic">A span whose end is deferred past the frame that started it — the CLIENT span of an Http call ends in the promise's then() — calls deactivate() as soon as its</text>
  <text x="700" y="935" text-anchor="middle" font-size="10.5" fill="#62645b" font-style="italic">synchronous part is over, which is what keeps every request of an Http::pool() a sibling rather than a chain.</text>

