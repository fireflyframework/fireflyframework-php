<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LaraFly">
  <title>LaraFly</title>
  <desc>The site favicon: the LaraFly firefly glyph in amber on the banner's slate tile.</desc>
  <defs>
    <linearGradient id="lff-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lff-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#lff-tile)"/>
  <g transform="translate(17,14)">
    <circle r="12" fill="url(#lff-spark)"/>
    <ellipse cx="-5.2" cy="-4" rx="6.3" ry="3.1" fill="#e0f2fe" opacity="0.6" transform="rotate(-22 -5.2 -4)"/>
    <ellipse cx="5.2" cy="-4" rx="6.3" ry="3.1" fill="#e0f2fe" opacity="0.6" transform="rotate(22 5.2 -4)"/>
    <ellipse cx="0" cy="0.9" rx="3.1" ry="4.6" fill="#0f172a"/>
    <ellipse cx="0" cy="-1.7" rx="2" ry="1.9" fill="#0b1220"/>
    <ellipse cx="0" cy="4.6" rx="1.9" ry="2.3" fill="#fbbf24"/>
  </g>
  <circle cx="7.5" cy="24.5" r="1.25" fill="#fbbf24" opacity="0.85"/>
  <circle cx="4.6" cy="28" r="0.85" fill="#fbbf24" opacity="0.55"/>
</svg>
